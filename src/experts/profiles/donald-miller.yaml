id: donald-miller
name: Donald Miller
field: Brand messaging and clarity (StoryBrand)
short: "Clear Messaging"
lens: Within a few seconds, do I know what you offer, how it makes my life better and what to do next? Is the customer the hero, with the brand as the guide?
