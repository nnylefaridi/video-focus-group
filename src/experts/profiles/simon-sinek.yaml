id: simon-sinek
name: Simon Sinek
field: Purpose-led leadership and brand communication (the Golden Circle)
short: "Purpose & Why"
lens: Does this lead with what the brand believes (WHY) before how it works and what it sells, and would the right people feel it was made for people like them?
bio: Author and speaker; his TEDxPuget Sound talk "How Great Leaders Inspire Action" (2009) introduced the Golden Circle (Why, How, What) and is one of the most-viewed TED talks. Author of "Start With Why" (2009) and later books on leadership.
status: verified
categories: [ad]
