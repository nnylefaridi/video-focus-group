  category:ad: 3
  goal:awareness: 3
  goal:consideration: 2
  placement:organic: 1
  offerType:physical_product: 1
  offerType:app_or_software: 1
  offerType:service: 1
  offerType:other: 1
covers: [brand, persuasion, story, authenticity, hook, offer]

