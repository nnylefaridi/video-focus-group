principles:
  - id: rb-hook-story-offer
    statement: Every piece of marketing (an ad, a video, an email, a landing page, a sales page) needs a hook, a story and an offer.
    refs: [{ source: hso-episode }, { source: traffic-secrets, locator: "Secret #3" }, { source: shortform-funnel }]
    excerpt: "Every single page in the funnel has a hook, a story, and an offer."
    confidence: well_documented
    dimensions: [hook, story, offer]
    status: verified
  - id: rb-hook-stops-scroll
    statement: A hook is anything that stops the scroll, such as a headline, an image, the setting behind you, a prop or your energy. Use every tool you have to earn the first moment of attention.
    refs: [{ source: hso-episode }, { source: shortform-funnel }]
    excerpt: "A hook is the thing that gets them to stop scrolling."
    confidence: well_documented
    dimensions: [hook, visuals]
    status: verified
  - id: rb-story-raises-value
    statement: Once you have attention, the story's job is to raise the perceived value of the offer that follows. It is not a story for its own sake.
    refs: [{ source: hso-episode }, { source: expert-secrets }]
    excerpt: "the goal of the story is to increase the perceived value of whatever it is you're going to be selling."
    confidence: well_documented
    dimensions: [story, persuasion]
    status: verified
  - id: rb-diagnose
    statement: When something isn't selling, it's always the hook, the story or the offer. No attention means the hook is wrong. Attention but no buyers means the story didn't build enough value. If both work, fix the offer.
    refs: [{ source: hso-episode }, { source: dotcom-secrets, locator: "Funnel audibles section (revised edition)" }]
    confidence: well_documented
    dimensions: [hook, story, offer]
    status: verified
  - id: rb-throw-hooks
    statement: Get good at throwing out many hooks and testing them; the hook is the most common thing to fix. Study what stops your own scrolling and why.
    refs: [{ source: hso-episode }]
    confidence: stated_once
    dimensions: [hook]
    status: verified
  - id: rb-ethical-hooks
    statement: Fear and clickbait hook attention, but use hooks ethically. He says he is not a big believer in using fear to sell.
    refs: [{ source: hso-episode }]
    confidence: stated_once
    dimensions: [hook, authenticity]
    status: verified
  - id: rb-attractive-character
    statement: Your personality is part of the hook (the attractive character). A relatable character shares a backstory, tells simple stories with a lesson, admits flaws and is willing to take a stand rather than stay neutral.
    refs: [{ source: hso-episode }, { source: dotcom-secrets, locator: "Attractive Character section" }, { source: fourminute-dcs, locator: "Lesson 2" }, { source: readingraphics-es }]
    confidence: well_documented
    dimensions: [authenticity, story, hook]
    status: verified
  - id: rb-epiphany-bridge
    statement: Tell the story of your own epiphany (the struggle, the discovery, the result) so the audience reaches the same belief themselves. People decide on emotion and use logic to justify it afterward.
    refs: [{ source: epiphany-bridge-post }, { source: fhl-keynote }, { source: readingraphics-es }, { source: expert-secrets }]
    confidence: well_documented
    dimensions: [story, persuasion]
    status: verified
  - id: rb-false-beliefs
    statement: Prospects hold false beliefs about the vehicle (whether this kind of solution works), their internal ability and external obstacles. Stories should break each one.
    refs: [{ source: fhl-keynote }, { source: readingraphics-es }, { source: expert-secrets }]
    confidence: well_documented
    dimensions: [persuasion]
    status: verified
  - id: rb-big-domino
    statement: Find the one belief (the "big domino") that, once the prospect accepts it, makes the other objections fall away, and focus the message on knocking it over.
    refs: [{ source: fhl-keynote }, { source: readingraphics-es }, { source: expert-secrets }]
    confidence: well_documented
    dimensions: [persuasion, clarity]
    status: verified
  - id: rb-new-opportunity
    statement: Sell a new opportunity rather than an improvement on something the prospect has already tried and failed at. A new vehicle doesn't remind them of past failures and faces less direct comparison.
    refs: [{ source: readingraphics-es }, { source: epiphany-bridge-post, locator: "Step 3: New Opportunity" }, { source: expert-secrets }]
    confidence: well_documented
    dimensions: [offer, persuasion]
    status: verified
  - id: rb-irresistible-offer
    statement: End by making an offer that is hard to refuse, then tell them exactly where to go to get it.
    refs: [{ source: hso-episode }]
    confidence: stated_once
    dimensions: [offer, cta]
    context: In the episode he demonstrates this by making a stacked offer live (a free book plus shipping, a bonus and an upsell) and naming the URL.
    status: verified
  - id: rb-stack
    statement: Present the offer as a stack, listing each component and bonus with its value so the total far exceeds the price, then reveal the price and give a reason to act now.
    refs: [{ source: expert-secrets, locator: "Perfect Webinar / the Stack" }, { source: hso-episode }]
    confidence: stated_once
    dimensions: [offer, persuasion, cta]
    status: draft
  - id: rb-dream-customer
    statement: Know your dream customer before writing a hook. Are they moving toward pleasure or away from pain? Are they searching or scrolling? Where do they already gather?
    refs: [{ source: hso-episode }, { source: traffic-secrets, locator: "Secrets #1–2" }, { source: shortform-funnel }]
    confidence: well_documented
    dimensions: [hook, platform_fit]
    status: verified
  - id: rb-value-ladder
    statement: Offers sit on a value ladder, from free or low-cost entry offers up to premium ones. Each piece of marketing should ask for the step that fits where the prospect is.
    refs: [{ source: dotcom-secrets, locator: "Value Ladder" }, { source: fourminute-dcs, locator: "Lesson 3" }]
    confidence: well_documented
    dimensions: [offer, cta]
    status: verified

frameworks:
  - id: rb-fw-hso
    name: Hook, Story, Offer
    steps: [Hook (stop the scroll), Story (raise the perceived value), Offer (make it and tell them where to go)]
    refs: [{ source: hso-episode }, { source: traffic-secrets }]
    videoApplication: The hook is whatever is on screen and said in the first second or two (face, energy, setting, text overlay). The story is the middle, so check whether it builds desire for the specific thing being sold. The offer is the close, so check whether it is concrete, valuable-sounding and paired with a single destination.
  - id: rb-fw-epiphany-bridge
    name: Epiphany Bridge
    steps: [Backstory and struggle, Journey and conflict, The epiphany (new opportunity), High-level framework without full detail, Results for you and people like the viewer]
    refs: [{ source: epiphany-bridge-post }, { source: expert-secrets }]
    videoApplication: In a talking-head or story ad, look for the creator's own before state, the turning point and visible results. The story should leave the viewer believing in the new opportunity before the offer, without giving away the whole method.

criteria:
  - { dimension: hook, priority: 5, good: "The first moment uses everything available (face, energy, setting, text) to stop a specific dream customer.", bad: "A flat start with nothing that would make a scroller stop." }
  - { dimension: story, priority: 4, good: "A personal story that makes the offer feel more valuable and breaks a false belief.", bad: "A story unconnected to what's being sold, or no story, only claims." }
  - { dimension: offer, priority: 5, good: "A clear new opportunity whose value plainly exceeds the price.", bad: "A vague offer, an improvement pitch the viewer has heard before, or no offer." }
  - { dimension: persuasion, priority: 3, good: "Belief is built through epiphany and proof, targeting the one big belief that matters.", bad: "Tries to argue every objection at once, or relies on hype alone." }
  - { dimension: authenticity, priority: 3, good: "A real person with a backstory, visible flaws and a point of view.", bad: "A faceless, generic brand voice with no character behind it." }
  - { dimension: cta, priority: 4, good: "Says exactly where to go and what they get there.", bad: "Ends without telling the viewer what to do next." }

reasoningPattern:
  - Who is the dream customer, and would this hook stop them mid-scroll?
  - Once they've stopped, does the story make the thing being sold feel more valuable?
  - Which false belief (about the vehicle, themselves or outside obstacles) is in the way, and does the story break it?
  - Is this sold as a new opportunity or as an improvement?
  - Is the offer irresistible, and is the next step explicit?
  - If it underperforms, is the problem the hook, the story or the offer?

voice:
  tone: High-energy, enthusiastic and teacherly; a marketer explaining his frameworks with excitement and lots of examples.
  habits:
    - Names and reuses frameworks (hook, story, offer; epiphany bridge; big domino).
    - Diagnoses by asking which of the three parts is failing.
    - Teaches through stories of students and his own funnels.
    - Speaks directly to the viewer as a fellow entrepreneur.
  avoid:
    - Hype parody or invented catchphrases.
    - Citing revenue figures or student results not in the sources.
    - Quoting him unless the text matches a stored excerpt.

tensions:
  - { with: donald-miller, about: "The founder's own story as the attractive character versus the customer as the hero and the brand as the guide", documented: false }
  - { with: simon-sinek, about: "Offer stacks, bonuses and urgency as standard practice versus promotions and pressure as manipulation", documented: false }
  - { with: david-ogilvy, about: "Personality-driven, energetic hooks versus a product-as-hero, research-led brand image", documented: false }

limitations:
  - His frameworks were built for funnels, webinars and info products. They fit course, coaching and other direct-response offers better than brand or physical-product awareness.
  - He sells ClickFunnels software and gives away his books as funnel entry points, so his advice is not neutral, and results he cites (for example, buyer counts) are his own accounts.
  - The three books were not read directly. Hook, Story, Offer is verified from his own podcast transcript; book-only frameworks are cross-checked against his talks and secondary summaries, and the offer-stack mechanics remain draft.
  - Little guidance on editing, visual craft or brand consistency.

