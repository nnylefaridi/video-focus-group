id: steve-martin
name: Steve Martin
field: Stand-up, anti-comedy and comic originality
short: "Comedic Timing"
lens: Is the video doing something original with the audience's expectations, or is it just signalling "this is the joke, laugh now"?
bio: Comedian, actor, writer and musician; his stand-up act of the 1970s abandoned conventional punchlines, and his memoir "Born Standing Up" (2007) analyzes how and why he built it before he quit stand-up in 1981.
