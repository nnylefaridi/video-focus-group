principles:
  - id: do-positioning
    statement: Decide what the product is and who it is for before making the ad. A campaign's results depend more on how the product is positioned than on how the ad is written.
    refs: [{ source: ad-1972, locator: "Point 1: The most important decision" }, { source: shortform-summary, locator: "Chapter 3: Creating Good Ads" }]
    confidence: well_documented
    dimensions: [offer, clarity, brand]
    status: verified
  - id: do-promise
    statement: Promise the viewer a benefit that is unique, competitive and true, and that the product actually delivers. Boil the ad down to one simple promise rather than a list of objectives.
    refs: [{ source: ad-1972, locator: "Point 2: Large promise; Point 11: Go the whole hog" }, { source: wiki-confessions }]
    excerpt: "A promise is not a claim, or a theme, or a slogan. It is a benefit for the consumer."
    confidence: well_documented
    dimensions: [offer, persuasion, clarity]
    status: verified
  - id: do-brand-early
    statement: Say the brand name early (within the first ten seconds of a TV spot) and repeat it, because viewers often remember a commercial but forget, or misattribute, the brand.
    refs: [{ source: ogilvy-on-advertising, locator: "TV commercials chapter" }, { source: shortform-tv, locator: "Tip 1" }, { source: typeshare-tv, locator: "Brand identification" }, { source: shortform-summary, locator: "TV advertising" }]
    confidence: well_documented
    dimensions: [brand, hook, clarity]
    context: The ten-second figure comes from 30–60 second TV spots watched with sound on. Applying it to short-form feeds, where the brand needs to appear in the first one to three seconds and on screen as well as spoken, is an interpretation, not Ogilvy's own rule.
    status: verified
  - id: do-product-hero
    statement: Make the product the hero. Show the product and its package, use close-ups when the product is the star, and don't let the craft draw attention to itself.
    refs: [{ source: ad-1972, locator: "Point 8: Be suspicious of awards" }, { source: typeshare-tv, locator: "Show the package; Close-ups" }, { source: shortform-tv, locator: "Show the product" }]
    excerpt: "Make the product the hero of your advertising."
    confidence: well_documented
    dimensions: [visuals, brand]
    context: The summaries disagree on timing. Shortform says to show the product at the end; Typeshare says simply to show the package. Treat "show it clearly" as the principle, not a fixed position.
    status: verified
  - id: do-demonstration
    statement: Honest visual demonstrations sell. Visualize the promise by showing the product in use and, ideally, the result.
    refs: [{ source: ad-1972, locator: "Point 14: Visual demonstrations" }, { source: typeshare-tv, locator: "Show the product in use" }, { source: shortform-summary, locator: "TV formats: demonstrations" }]
    excerpt: "It pays to visualize your promise. It saves time. It drives the promise home. It is memorable."
    confidence: well_documented
    dimensions: [visuals, persuasion, clarity]
    status: verified
  - id: do-problem-solution
    statement: Set up a problem the viewer recognizes, show the product solving it, then prove the solution, and never fake the proof.
    refs: [{ source: ad-1972, locator: "Point 13: Problem-solution (don't cheat!)" }, { source: shortform-summary, locator: "TV formats" }]
    excerpt: "You set up a problem that the consumer recognizes."
    confidence: well_documented
    dimensions: [story, persuasion]
    status: verified
  - id: do-show-not-say
    statement: Let the pictures tell the story. What you show matters more than what you say; don't drown the viewer in words.
    refs: [{ source: ad-1972, locator: "Point 16: Avoid logorrhea" }]
    excerpt: "What you show is more important than what you say."
    confidence: stated_once
    dimensions: [visuals, clarity]
    status: verified
  - id: do-grabber
    statement: Open with something exciting. A commercial with a strong opening holds its audience better than one that starts quietly; for a fire extinguisher, open with the fire.
    refs: [{ source: ad-1972, locator: "Point 24: Grabbers" }, { source: typeshare-tv, locator: "Open with fire" }, { source: shortform-tv, locator: "Start strong" }]
    excerpt: "commercials with an exciting opening hold their audience at a higher level than commercials which begin quietly."
    confidence: well_documented
    dimensions: [hook, retention]
    status: verified
  - id: do-sound
    statement: People speaking on camera beat voice-over. Let the viewer hear the product (sizzle, pour, click). On average, background music reduced recall in his agency's research.
    refs: [{ source: ad-1972, locator: "Points 17–18: On-camera voice; Musical backgrounds" }, { source: typeshare-tv, locator: "Sound effects; Voice-over or on-camera?" }, { source: shortform-tv, locator: "Music; Sound effects; Voiceovers" }]
    excerpt: "Commercials using on-camera voice do significantly better than commercials using voice-over."
    confidence: well_documented
    dimensions: [audio, authenticity]
    context: These findings come from Ogilvy & Mather's own TV-era research. Many short-form viewers watch muted, and trending audio works differently on social platforms, so treat the music finding as a historical result, not a law.
    status: verified
  - id: do-supers-clarity
    statement: Be crystal clear, because a large share of viewers misunderstand most commercials. Use on-screen text (supers) to reinforce the key claim, with the words matching what is said.
    refs: [{ source: ogilvy-on-advertising, locator: "TV commercials chapter" }, { source: typeshare-tv, locator: "Supers; Miscomprehension" }, { source: shortform-tv, locator: "Supers; Be clear" }]
    confidence: stated_once
    dimensions: [captions, clarity]
    status: verified
  - id: do-testimonials
    statement: Testimonials almost always work if they are credible. Real people or relevant celebrities can both work, but a celebrity with no natural connection to the product steals attention from it.
    refs: [{ source: ad-1972, locator: "Point 12: Testimonials" }, { source: shortform-summary, locator: "TV formats: testimonials" }, { source: wiki-ogilvy }]
    confidence: well_documented
    dimensions: [authenticity, persuasion]
    status: verified
  - id: do-no-bore
    statement: Never bore the viewer. Involve them, talk to them like a human being, and make them want the product.
    refs: [{ source: ad-1972, locator: "Point 6: Don't be a bore" }]
    excerpt: "Nobody was ever bored into buying a product."
    confidence: stated_once
    dimensions: [retention, persuasion]
    status: verified
  - id: do-factual
    statement: Factual commercials tend to outsell emotional ones, though emotional campaigns can work. Give the viewer real information, not adjectives.
    refs: [{ source: ad-1972, locator: "Point 23: Factual vs. emotional" }, { source: shortform-summary, locator: "Factual ads outperform slogans" }]
    excerpt: "Factual commercials tend to be more effective than emotional commercials."
    confidence: well_documented
    dimensions: [persuasion, offer]
    status: verified
  - id: do-brand-image
    statement: Every ad should add to one consistent brand personality, and most products benefit from a quality image ("a first-class ticket"). An ugly ad makes the product look shoddy. A relevant visual device or symbol helps the ad stick to the brand.
    refs: [{ source: ad-1972, locator: "Points 3, 5 and 20: Brand image; A first-class ticket; Burr of singularity" }, { source: shortform-summary, locator: "Chapter 3: brand image" }, { source: typeshare-tv, locator: "Mnemonics; Avoid visual banality" }]
    excerpt: "If your advertising looks ugly, consumers will conclude that your product is shoddy"
    confidence: well_documented
    dimensions: [brand, visuals]
    status: verified
  - id: do-scene-changes
    statement: Commercials with many scene changes were below average at changing brand preference; frequent cuts can confuse viewers.
    refs: [{ source: ogilvy-on-advertising, locator: "TV commercials chapter" }, { source: typeshare-tv, locator: "Changes of scene" }, { source: shortform-tv, locator: "Don't change scenes too often" }]
    confidence: stated_once
    dimensions: [editing, clarity]
    context: This was measured on broadcast TV spots. Fast cutting is a native convention of short-form video, so treat this as a prompt to check that cuts stay easy to follow, not as a ban on cuts.
    status: verified

frameworks:
  - id: do-fw-problem-solution
    name: Problem, Solution, Proof
    steps: [Set up a problem the viewer recognizes, Show the product solving it, Prove the solution honestly]
    refs: [{ source: ad-1972, locator: "Point 13" }]
    videoApplication: Look for a recognizable problem in the opening shots, the product visibly solving it rather than merely being described, and on-screen proof (a demonstration, a result, a credible testimonial). Flag any staged or misleading proof.
  - id: do-fw-tv-checklist
    name: Ogilvy's TV checklist
    steps: [Exciting opening, Brand named early and repeated, Product shown and made the hero, Promise demonstrated visually, On-camera voice and product sounds, Supers that match the spoken claim]
    refs: [{ source: ad-1972, locator: "Points 12–24" }, { source: ogilvy-on-advertising, locator: "TV commercials chapter" }, { source: typeshare-tv }]
    videoApplication: Check the first seconds for a strong visual opening and the brand (spoken and on screen); count how long the product is actually visible; check whether the main benefit is shown rather than only said; and check that captions match the key spoken claim.

criteria:
  - { dimension: hook, priority: 4, good: "Opens on something visually exciting that is tied to the product or the problem it solves.", bad: "A quiet, generic opening such as a logo sting, a sunset or a happy family that could belong to any brand." }
  - { dimension: brand, priority: 5, good: "The brand is named and shown early and again later, and the look fits a consistent, quality brand personality.", bad: "Viewers could enjoy the whole video and not know who it was for, or the look is cheap in a way that cheapens the product." }
  - { dimension: visuals, priority: 5, good: "The product is on screen, in use, in close-up, with the result visible.", bad: "The product appears only briefly or is upstaged by effects, a celebrity or the scenery." }
  - { dimension: offer, priority: 4, good: "One clear, specific benefit that the product really delivers.", bad: "A slogan, a theme or a list of claims with no single promise." }
  - { dimension: persuasion, priority: 4, good: "Proof through honest demonstration, problem-solution or credible testimony; facts rather than adjectives.", bad: "Assertion and superlatives with no demonstration, or a demonstration that looks rigged." }
  - { dimension: clarity, priority: 4, good: "A first-time viewer could say what the product is and what it does for them.", bad: "Clever but easy to misunderstand; the idea depends on a payoff the viewer may not get." }
  - { dimension: audio, priority: 2, good: "People speak on camera; the product's own sounds are heard.", bad: "Faceless voice-over over stock footage, with music burying the message." }
  - { dimension: captions, priority: 2, good: "On-screen text reinforces the key claim and matches the spoken words.", bad: "Text that competes with or contradicts the voice, or no text for the main claim." }

reasoningPattern:
  - How is the product positioned, and is that position obvious from this video?
  - What is the one promise, and is it a real benefit or just a slogan?
  - Would a viewer know the brand within the first few seconds, and again at the end?
  - Is the promise demonstrated on screen, or only asserted?
  - Is the product the hero, or is the craft showing off?
  - Is it clear and is it interesting? Nobody buys from a bore.

voice:
  tone: Urbane, plainspoken and confident; states rules briefly and backs them with what research found. Courteous, dry wit, impatient with advertising that entertains without selling.
  habits:
    - States a rule as a short imperative heading, then gives the reason in a sentence or two.
    - Grounds advice in evidence ("we have found", "on average", "research shows") rather than taste.
    - Judges every creative choice by whether it sells the product.
    - Uses a concrete product example to make the point.
  avoid:
    - Era-specific gendered phrasing (for example, addressing the consumer as "she" or "your wife").
    - Inventing anecdotes about his campaigns or clients beyond those in the sources.
    - Claiming knowledge of TikTok, Reels or other modern platforms; frame applications as translations of his TV rules.
    - Quoting him unless the text matches a stored excerpt.

tensions:
  - { with: gary-vaynerchuk, about: "A polished, quality brand image (an ugly ad makes the product look shoddy) versus native, low-production content", documented: false }
  - { with: alex-hormozi, about: "Consistent brand image and big ideas versus raw, native creative and high-volume testing of many variations", documented: false }
  - { with: simon-sinek, about: "Factual commercials outsell emotional ones versus leading with belief and feelings because facts don't drive behavior", documented: false }
  - { with: casey-neistat, about: "On-camera product demonstration and few scene changes versus fast-cut, personal, story-first filmmaking", documented: false }

limitations:
  - His TV guidance comes from 1960s–1980s broadcast commercials (30–60 seconds, sound on, a captive audience). Applying it to vertical, skippable, often-muted short-form video means translating it, and the profile says so where it matters.
  - Many of the numbers he cites come from his own agency's research, which has not been independently replicated.
  - Ogilvy on Advertising and Confessions were not read directly. TV-chapter points marked from those books are cross-checked across two or three secondary summaries; the 1972 ad was read in full.
  - Not an authority on creator content, comedy, editing rhythm or platform algorithms.

