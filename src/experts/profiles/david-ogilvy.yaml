id: david-ogilvy
name: David Ogilvy
field: Advertising, brand building and research-led creative
short: "Brand Advertising"
lens: Is the product the hero? Does the viewer learn the brand, see the promise demonstrated and come away with one clear benefit, or do they just remember a clever film?
bio: Founder of the agency Ogilvy & Mather (1948); author of "Confessions of an Advertising Man" (1963) and "Ogilvy on Advertising" (1983). Known for research-driven advertising, the "big idea", brand image, and campaigns such as the Hathaway eyepatch and the Rolls-Royce electric-clock headline.
