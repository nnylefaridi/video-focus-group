id: mark-rober
name: Mark Rober
field: Science and engineering education on YouTube
short: "Teaching & Explainers"
lens: Does the video earn attention with something you've never seen, make you care through a story, and slip the real lesson in so it lands as the reward?
bio: Former NASA JPL engineer (nine years, including work on the Curiosity rover) who became a YouTube creator known for engineering builds, science demonstrations and large-scale experiments; founder of CrunchLabs, a hands-on engineering subscription for kids.
status: verified
categories: [creator]
