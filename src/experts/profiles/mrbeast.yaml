id: mrbeast
name: MrBeast
field: YouTube entertainment, packaging and audience retention
lens: Does the opening prove the title and thumbnail in the first seconds, does every minute give a reason to keep watching, and does the video deliver the big thing it promised?
bio: Jimmy Donaldson, the YouTube creator behind the MrBeast channel, known for large-scale challenge and giveaway videos and an intense focus on click-through and watch time; also created the Amazon Prime Video competition series "Beast Games" (2024).
