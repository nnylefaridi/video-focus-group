# Fly.io config for the hosted site. See docs/hosting.md for the full launch steps.
# `app` is the website; `worker` makes the reviews. Both run the same image.
app = "video-focus-group"      # change to a name that's free on Fly (fly launch --no-deploy can pick one)
primary_region = "yyz"         # Toronto; pick the region closest to your Supabase project

[build]
  dockerfile = "Dockerfile"
  # NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY are passed on the command line:
  #   fly deploy --build-arg NEXT_PUBLIC_SUPABASE_URL=... --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=...

[env]
  PANEL_MODE = "hosted"
  HOST = "0.0.0.0"
  PORT = "8080"
  # Fly's proxy overwrites Fly-Client-IP with the visitor's address on every request.
  CLIENT_IP_HEADER = "Fly-Client-IP"
  # One proxy (Fly's) is in front of the website.
  TRUSTED_PROXIES = "1"

[processes]
  app = "node server.mjs"
  worker = "node --import tsx worker/index.mts"

[http_service]
  processes = ["app"]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/api/health"
    protocol = "http"
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"

# The worker has no [http_service]: nothing on the internet can reach it. It must stay on
# so it keeps picking up uploaded videos, so it never auto-stops.
[[vm]]
  processes = ["app"]
  size = "shared-cpu-1x"
  memory = "1gb"

[[vm]]
  processes = ["worker"]
  size = "shared-cpu-2x"
  memory = "2gb"
